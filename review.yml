    - url: https://connect.api-au.qbe.com/developer/apis/x-digital-brokers-qbe-anzov1/operations/{operationId}?api-version=2022-04-01-preview
      httpStatus: 200
      fetched: '2026-07-25'
      note: parameters, headers, request representations with examples, response codes
    - url: https://connect.api-au.qbe.com/developer/apis/x-digital-brokers-qbe-anzov1/schemas/67dd2297fb42680af0ea6dcb?api-version=2022-04-01-preview
      httpStatus: 200
      fetched: '2026-07-25'
      note: application/vnd.oai.openapi.components+json, 258 schemas, 405 KB
