summary: >-
  QBE publishes no versioning policy, no deprecation policy, no changelog, no roadmap, no SLA and no
  status page on any surface reachable anonymously. What can be established is the versioning MECHANISM
  (Azure APIM version sets, both APIs at v1) and the access lifecycle (approval-gated product
  subscriptions with a hard cap of 10 per product). Absence here is the finding, not an omission in the
  harvest — each item below was probed.
versioning:
  scheme: azure-apim-version-set
  current: v1
  in_url: false
  version_sets:
  - api: ANZO Digital Brokers Experience API
    apiId: x-digital-brokers-qbe-anzov1
    apiVersion: v1
    apiVersionSetId: x-digital-brokers-qbe-anzoversionset
  - api: CTP Switch Service
    apiId: ctp-switch-service
    apiVersion: v1
    apiVersionSetId: 68ad05724a9c5fb442ddf729
  policy_url: null
  note: >-
    A version set exists for each API, so QBE has the machinery to run v2 alongside v1, but only one
    version of each is published and no policy describes how versions are introduced or retired.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    No operation in either spec carries deprecated: true, and neither RFC 8594 Sunset nor Deprecation
    headers appear in any response definition. No deprecation policy page was found.
