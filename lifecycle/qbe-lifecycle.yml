    generic Statuspage marketing page, not a QBE status page. Not a hit.'}
changelog:
  url: null
  note: >-
    No dated changelog or release notes are published on either portal. The portals have no /changelog
    route (HTTP 404 on connect.api-au.qbe.com).
roadmap:
  url: null
health:
  operation: get-__health
  path: /__health
  method: GET
  note: >-
    The broker API does expose a health endpoint — GET /__health, "To check the health of the API",
    returning {app, dateTime}. It requires X-TrackingID and is behind the same subscription gate, so it
    is a partner-facing health check rather than a public status signal.
access_lifecycle:
  self_serve: false
  products:
  - id: anzo-digital-brokers-product
    name: ANZO Digital Brokers
    subscriptionRequired: true
    approvalRequired: true
    subscriptionsLimit: 10
  - id: anzo-ctp-switch-product
    name: ANZO CTP Service
    subscriptionRequired: true
    approvalRequired: true
    subscriptionsLimit: 10
  note: >-
    QBE North America's guide describes the same shape from the partner side: QBE emails credentials
    after approval, partners subscribe per product under a "<Partner Name>-<Product Name>" naming
    convention, accept Terms & Conditions, and can watch consumption on an Activity Report page.
