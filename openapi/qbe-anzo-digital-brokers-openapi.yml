components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
  schemas:
    items:
      title: Error type
      required:
      - message
      type: object
      properties:
        code:
          type: string
          description: A specific error code for consumers to customise errors
        message:
          type: string
          description: A detailed error message to be passed to clients
        details:
          description: An object of anytype. This is left open as an API implementation may return additional errors depending
            on the error
    PolicyType:
      title: PolicyType
      required:
      - customerParty
      - risks
      - questions
      type: object
      properties:
        policyHeader:
          type: object
          properties:
            variableCommRate:
              type: number
            brokerFeeTotal:
              type: number
            commissionType:
              enum:
              - VARIABLE
              type: string
            subProductCd:
              type: string
            cancelReasonCode:
              enum:
              - CL
              - PR
              - DC
              - TL
              - IC
              - OG
              - IE
              - LR
              - ER
              - NR
              - CO
              - NP
              - PS
              type: string
              description: Reason codes for Cancellation of the existing policy CL -  Cancelled (Payout) PR - Policy Replaced
                DC - Declined by Company TL - Total Loss IC - Found cheaper Policy OG - Outside Guidelines IE - Insured Elsewhere
                LR - Loan Refinance ER - Error Correction NR - Not Required CO - Cooling Off NP - Non-Payment PS - Property
                Sold
            policyTransactionInformation:
              required:
              - inceptionDate
              - product
              type: object
              properties:
                inceptionDate:
                  type: string
                  description: Inception date of the policy in format `yyyy-mm-dd`
                  format: date
                  example: '2019-01-01'
                effectiveDate:
                  type: string
                  description: Effective Date in the format in format `yyyy-mm-dd`. Defaulted to inceptionDate if not provided
                  format: date
                  example: '2019-09-09'
                expiryDate:
                  type: string
                  description: Expiry date in the format `yyyy-mm-dd`. Defaulted to inceptionDate + 1 year if not provided
                  format: date
                  example: '2019-09-09'
                product:
                  enum:
                  - BPK
                  - MSA
                  - MPA
                  - MVA
                  type: string
                policyNumber:
                  type: string
                  example: 145U475933BPK
                policyStatus:
                  type: string
                policyMessageStatus:
                  type: string
                deleteReferIfExist:
                  type: boolean
                returnStatusInResponse:
                  type: boolean
                partialDeclineAllowed:
                  type: boolean
                terminateRisksNotPassed:
                  type: boolean
                transactionType:
                  enum:
                  - NEW_QUOTE
                  - CONVERT_QUOTE
                  - ENDORSEMENT
                  - RENEWAL
                  - RENEWAL_AMEND
                  - CANCEL
                  type: string
            PDSDetails:
              required:
              - QMNumber
              - versionNo
              - url
              type: object
              properties:
                QMNumber:
                  type: string
                  example: QM8166
                versionNo:
                  type: string
                  example: 0318
                url:
                  type: string
                  example: http://mock.qbe.com.au/content/idcplg?IdcService=GET_FILE&dDocName=PRODCT123456&RevisionSelectionMethod=Latest&Rendition=primary
        customerParty:
          required:
          - location
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            taxIndicator:
              enum:
              - I
              - P
              - T
              - N
              - X
              type: string
            taxPercent:
              type: number
              example: 0
            orgName:
              type: string
            orgABN:
              pattern: ^(\d *?){11}$
              type: string
              example: '14069979460'
            businessName:
              type: string
            tradingName:
              type: string
            businessEntity:
              type: string
              description: TBD
            emailNotification:
              type: boolean
            contact:
              type: object
              properties:
                primaryEmailAddress:
                  pattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
                  type: string
                  example: example@qbe.com
                mobilePhoneNumber:
                  type: string
                workPhoneNumber:
                  type: string
                homePhoneNumber:
                  type: string
            location:
              $ref: '#/components/schemas/type_9'
        risks:
          type: array
          items:
            $ref: '#/components/schemas/items_10'
        questions:
          type: array
          items:
            required:
            - questionId
            - answer
            type: object
            properties:
              questionId:
                type: string
                example: '1'
              answer:
                required:
                - text
                type: object
                properties:
                  text:
                    type: string
                    example: 'false'
              historyDetailsList:
                type: array
                items:
                  type: object
                  properties:
                    itemDate:
                      type: string
                    cause:
                      type: string
                    riskClass:
                      type: string
                    cost:
                      type: number
                    detailLines:
                      type: array
                      items:
                        type: string
        referral:
          type: object
          properties:
            reasons:
              maxItems: 10
              minItems: 1
              type: array
              items:
                type: string
        policyPremium:
          $ref: '#/components/schemas/type'
