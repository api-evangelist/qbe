name: QBE Insurance
kind: company
description: >-
  QBE Insurance Group Limited is a Sydney-headquartered, ASX-listed global general
  insurance and reinsurance group, tracing back to 1886 in Townsville, Queensland,
  and operating today across Australia Pacific, North America and International
  divisions including a Lloyd's of London syndicate. QBE writes commercial and
  personal property and casualty lines — property, liability, motor and compulsory
  third party (CTP), workers compensation, marine, aviation, trade credit, crop and
  specialty — distributed overwhelmingly through brokers and agents rather than
  direct to consumers. Its API posture reflects that distribution model and is
  partner-gated by design: QBE Australia runs a real, publicly browsable Azure API
  Management developer portal at connect.api-au.qbe.com whose catalogue, operations,
  schemas and examples can be read anonymously, but every product requires an
  approved subscription (approvalRequired true) and the broker API is keyed to named
  partner platforms. The portal exposes genuine quote, bind, endorse, renew, cancel
  and refer operations for the commercial policy lifecycle — the four real insurance
  verbs, minus claims/FNOL, which QBE does not expose publicly. A separate QBE North
  America partner API hub at partnerportal-api.qbena.com serves an empty Azure APIM
  catalogue to anonymous callers but does publish seven named API products in its own
  content pages — Quote, Bind, Master Liability, Property Inquiry, Zip Code Validate
  and Reconciliation and Cancellation for Renters, plus Quote for Homeowners — behind a
  documented client-id/secret to JWT token exchange; no endpoints or specs are exposed.
  QBE Hong Kong documents a partner API behind qbe.com pages that are bot-blocked to
  anonymous fetchers. Australia is the home market; the Consumer Data Right was
  designated for general insurance and then deferred, so nothing here is compelled by
  regulation.
