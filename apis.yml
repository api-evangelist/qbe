- aid: qbe:qbe-ctp-switch-service-api
  name: QBE Australia CTP Switch Service
  description: >-
    A small QBE Australia service published in the same API Hub as the "ANZO CTP
    Service" product, supporting the compulsory third party (CTP) motor insurance
    switching flow. Two documented operations append data to and retrieve saved data
    for a CTP document, keyed by a code parameter. Like every product in the hub it
    requires an approved subscription key and is partner-gated rather than self-serve.
  humanURL: https://connect.api-au.qbe.com/apis
  baseURL: https://gateway.api-au.qbe.com/ctp-service
