apis:
- aid: qbe:qbe-anzo-digital-brokers-api
  name: QBE Australia ANZO Digital Brokers Experience API
  description: >-
    QBE Australia's broker-facing policy lifecycle API, published in the QBE
    Australia API Hub as the "ANZO Digital Brokers" product. QBE describes it as
    providing "access to the insurance policy lifecycle with QBE from creating quotes
    to policy binding, endorsements, renewals and more", integrating a broker
    platform with QBE's underwriting system. Fifteen documented operations cover
    create/modify/abandon quote, bind a quote into a policy (issuing a policy
    number), endorse, renew, cancel, abandon and refer a policy to a QBE underwriter,
    plus quote and policy document upload and a health check. Access requires an
    approved Azure APIM subscription key plus X-ClientID / X-ClientSecret and an
    X-Partner-Id drawn from a fixed enumeration of QBE's broker partners — it is not
    self-serve. No claims or FNOL operations are exposed.
  humanURL: https://connect.api-au.qbe.com/apis
  baseURL: https://gateway.api-au.qbe.com/x-digital-brokers-qbe-anzo/api
  tags:
  - Insurance
  - Quotes
  - Bind
  - Policy Administration
  - Brokers
  - Australia
  tags_raw:
