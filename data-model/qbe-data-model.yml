notes: Entity graph derived from the QBE ANZO Digital Brokers OpenAPI components (258 schemas). QBE uses
  one canonical policy document (PolicyType) as the request body for every lifecycle verb — quote, bind,
  endorse, renew, cancel, abandon and refer all post the same shape and differentiate on policyTransactionInformation.transactionType
  plus the x-*-policy-transaction headers. There is no ACORD payload; identifiers are QBE-native (policyNumber
  e.g. 145U475933BPK, quoteId, policyId). Schema names such as type_11 / items_10 are Azure APIM auto-generated
  component names, carried verbatim from QBE.
identifiers:
- name: quoteId
  in: path
  description: Quote identifier returned by Create-a-new-Quote; re-issued by Modify-an-existing-Quote.
- name: policyId
  in: path
  description: Policy identifier; a policy number is issued when a quote is bound.
- name: policyNumber
  in: body
  example: 145U475933BPK
  description: QBE policy number; the trailing three characters are the product code (BPK).
- name: x-master-ref-id
  in: header
  description: Correlation reference carried across a multi-step lifecycle transaction (endorse/cancel/renew
    then bind or abandon).
