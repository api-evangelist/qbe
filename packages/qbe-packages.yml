summary: >-
  QBE ships NO API client SDK in any language. There is no first-party library for the ANZO Digital
  Brokers API, the CTP Switch Service or the QBE North America partner APIs — partners are expected to
  call the REST endpoints directly (QBE's own North America guide tells partners to test with Postman or
  SoapUI and hand-build the token call). Two genuinely first-party QBE packages DO exist on npm, but
  they are front-end engineering standards published by QBE Insurance Group Limited, not API clients.
