notes: >-
  Cross-cutting standards posture for QBE's published APIs. QBE makes no explicit conformance claim
  anywhere anonymously readable, so every assertion below is derived from what the specs and the APIM
  catalogue actually contain. Two results are worth calling out for a general insurer: there is NO ACORD
  anywhere (the payload is a QBE-proprietary canonical policy model, not ACORD XML/AL3, and no IVANS or
  NGDS reference appears in any of the 17 operations or 258 schemas), and there is no open-insurance
  mandate behind this surface — Australia's Consumer Data Right was designated for general insurance and
  then deferred, so nothing here is regulator-compelled.
