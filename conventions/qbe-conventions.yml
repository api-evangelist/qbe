summary: >-
  Cross-cutting request/response semantics for QBE's published APIs, derived from QBE's own operation
  and schema definitions. The shape is a MuleSoft experience API fronted by Azure API Management: JSON
  over HTTPS, a single canonical policy document posted to every lifecycle verb, an errors[] envelope,
  mandatory per-request tracing, and a correlation reference (x-master-ref-id) that stitches a two-step
  transaction (endorse/cancel/renew, then bind or abandon) together.
authentication:
  style: APIM subscription key + partner client credentials as headers
  detail: authentication/qbe-authentication.yml
transport:
  protocols: [https]
  content_type: application/json
  note: >-
    Both published APIs declare protocols ["https"] only in the APIM catalogue. Document upload
    operations post a body carrying effectiveDate plus primaryFile.
idempotency:
  coverage: none
  supported: false
  header: null
  note: >-
    QBE documents no idempotency key. Every lifecycle operation is a POST/PUT with no
    Idempotency-Key parameter anywhere in either spec, and no retry-safety guidance is published.
    x-master-ref-id is a CORRELATION reference, not an idempotency key — QBE's own description is
    "Send the x-master-ref-id value that was send during preceeding transaction for
    endorse/cancel/renewal", i.e. it links a follow-on bind/abandon/refer to the transaction that
    opened it. Re-sending the same request is not defined as safe.
correlation:
  header: x-master-ref-id
  required: true
  operations: 11
  description: >-
    Carried across the two-step lifecycle: an endorse / cancel / renew call opens a pending transaction,
    and the subsequent bind, abandon or refer call must replay the same x-master-ref-id together with
    the matching x-bind-policy-transaction / x-abandon-policy-transaction / x-refer-policy-transaction
    value (ENDORSEMENT | CANCEL | RENEWAL).
request_tracing:
  header: X-TrackingID
  required: true
  operations: 14
  description: Source system's tracking ID for troubleshooting / analysis purposes.
  response_header: null
pagination:
  supported: false
  note: >-
    There is no list/collection operation in either published API — every operation acts on a single
    quote or policy identified in the path — so no pagination convention exists.
filtering_and_expansion:
  supported: false
  note: >-
    No sparse fieldsets, no expand parameter and no field selection. Response shape is fixed per
    operation. The only query parameters published are `type` (document upload context) and `code`
